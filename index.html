<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solicitud de Útiles de Escritorio</title>
<style>
* { box-sizing: border-box; }

body {
  font-family: 'Segoe UI', Arial, sans-serif;
  background: #f2f4f7;
  margin: 0;
  padding: 24px 12px;
  color: #1f2937;
}

.contenedor {
  max-width: 640px;
  margin: 0 auto;
  background: #fff;
  border-radius: 12px;
  padding: 28px;
  border: 1px solid #111111;
  box-shadow: 0 4px 14px rgba(0,0,0,0.10);
}

.encabezado-uc {
  display: flex;
  align-items: center;
  padding-bottom: 16px;
  margin-bottom: 22px;
  border-bottom: 3px solid #111111;
}

.marca-texto {
  position: relative;
  padding-left: 16px;
  font-weight: 800;
  font-size: 21px;
  line-height: 1.15;
  color: #111111;
  text-transform: uppercase;
  letter-spacing: 0.8px;
}

.marca-texto::before {
  content: '';
  position: absolute;
  left: 0;
  top: 1px;
  bottom: 1px;
  width: 5px;
  border-radius: 3px;
  background: linear-gradient(180deg, #c8102e 0%, #111111 100%);
}

h1 {
  font-size: 20px;
  margin-bottom: 4px;
  color: #111111;
  text-align: center;
}

.nota {
  color: #6b7280;
  font-size: 13px;
  margin-top: 0;
  margin-bottom: 20px;
  text-align: center;
}

.fila-datos {
  display: flex;
  gap: 14px;
  flex-wrap: wrap;
}

.campo {
  flex: 1;
  min-width: 140px;
  margin-bottom: 14px;
}

label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 4px;
  color: #374151;
}

input[type="text"], input[type="email"], input[type="number"], select, textarea {
  width: 100%;
  padding: 9px 10px;
  border: 1px solid #d1d5db;
  border-radius: 8px;
  font-size: 14px;
  font-family: inherit;
}

textarea {
  min-height: 60px;
  resize: vertical;
}

.producto {
  position: relative;
  border: 1px solid #e5e7eb;
  border-radius: 10px;
  padding: 16px;
  margin-bottom: 16px;
  background: #fafafa;
}

.btn-quitar {
  position: absolute;
  top: 10px;
  right: 10px;
  background: none;
  border: none;
  color: #9ca3af;
  font-size: 16px;
  cursor: pointer;
}
.btn-quitar:hover { color: #dc2626; }

.btn-secundario {
  background: #f2f2f2;
  color: #111111;
  border: 1px dashed #111111;
  border-radius: 8px;
  padding: 10px 14px;
  cursor: pointer;
  width: 100%;
  font-size: 14px;
  margin-bottom: 20px;
}
.btn-secundario:hover { background: #e6e6e6; }

.acciones {
  text-align: right;
}

.btn-primario {
  background: #111111;
  color: #fff;
  border: none;
  border-radius: 8px;
  padding: 11px 24px;
  font-size: 14px;
  cursor: pointer;
}
.btn-primario:hover { background: #000000; }
.btn-primario:disabled { background: #9a9a9a; cursor: not-allowed; }

#mensaje {
  margin-top: 14px;
  font-size: 14px;
  text-align: center;
}
#mensaje.exito { color: #15803d; }
#mensaje.error { color: #dc2626; }
</style>
</head>
<body>

  <div class="contenedor">
    <div class="encabezado-uc">
      <span class="marca-texto">UNIVERSIDAD CONTINENTAL</span>
    </div>

    <h1>Formato de Solicitud de Útiles de Escritorio</h1>
    <p class="nota">Campus Cusco — Uso interno de las áreas.</p>

    <form id="formSolicitud">
      <div class="fila-datos">
        <div class="campo">
          <label for="nombres">Nombres y apellidos completos</label>
          <input type="text" id="nombres" required placeholder="Ej. Juan Pérez Quispe">
        </div>
        <div class="campo">
          <label for="correo">Correo institucional</label>
          <input type="email" id="correo" required placeholder="nombre@continental.edu.pe">
        </div>
      </div>
      <div class="fila-datos">
        <div class="campo">
          <label for="centroCostos">Centro de costos</label>
          <input type="text" id="centroCostos" required placeholder="Ej. 005400">
        </div>
      </div>

      <div id="productos"></div>

      <button type="button" id="btnAgregar" class="btn-secundario">+ Agregar otro producto</button>

      <div class="acciones">
        <button type="submit" id="btnEnviar" class="btn-primario">Enviar solicitud</button>
      </div>

      <p id="mensaje"></p>
    </form>
  </div>

  <template id="plantillaProducto">
    <div class="producto">
      <button type="button" class="btn-quitar" title="Quitar producto">✕</button>

      <div class="campo">
        <label>Código</label>
        <input type="text" class="input-codigo" list="listaCodigos" autocomplete="off" required placeholder="Escribe o busca el código">
      </div>

      <div class="campo">
        <label>Descripción del producto</label>
        <input type="text" class="input-descripcion" readonly placeholder="Se completa automáticamente">
      </div>

      <div class="fila-datos">
        <div class="campo">
          <label>Cantidad</label>
          <input type="number" class="input-cantidad" min="1" required>
        </div>
        <div class="campo">
          <label>Unidad</label>
          <select class="input-unidad" required>
            <option value="UND">Unidad</option>
            <option value="CAJA">Caja</option>
            <option value="PAQUETE">Paquete</option>
            <option value="CIENTO">Ciento</option>
            <option value="MILLAR">Millar</option>
            <option value="DOCENA">Docena</option>
          </select>
        </div>
      </div>

      <div class="campo">
        <label>Referencia (opcional)</label>
        <textarea class="input-ref-texto" placeholder="Describe la referencia técnica (marca, color, tamaño, etc.)"></textarea>
      </div>

      <div class="campo">
        <label>Comentarios (opcional)</label>
        <textarea class="input-comentarios" placeholder="Alguna observación adicional sobre este producto"></textarea>
      </div>
    </div>
  </template>

  <datalist id="listaCodigos"></datalist>

<script>
// ============================================
// URL de tu Web App de Apps Script (termina en /exec)
// ============================================
const URL_APPS_SCRIPT = 'https://script.google.com/macros/s/AKfycbwv6hQCKk1M36u5lmXTcCkeGKGDqRd_cu7UaREHKgCLC2bVDlD9AOGY0B1qqYyXJ_984w/exec';

let codigosDisponibles = []; // [{codigo, descripcion}, ...]

const contenedorProductos = document.getElementById('productos');
const plantilla = document.getElementById('plantillaProducto');
const datalist = document.getElementById('listaCodigos');
const mensaje = document.getElementById('mensaje');

// 1. Cargar el listado de códigos al abrir la página
async function cargarCodigos() {
  try {
    const resp = await fetch(`${URL_APPS_SCRIPT}?action=codigos`);
    const data = await resp.json();
    if (data.status === 'ok') {
      codigosDisponibles = data.codigos;
      datalist.innerHTML = codigosDisponibles
        .map(c => `<option value="${c.codigo}">${c.descripcion}</option>`)
        .join('');
    }
  } catch (err) {
    mostrarMensaje('No se pudo cargar el listado de códigos. Verifica la conexión.', 'error');
  }
}

// 2. Crear un bloque de producto nuevo
function agregarProducto() {
  const nodo = plantilla.content.cloneNode(true);
  const div = nodo.querySelector('.producto');

  const inputCodigo = div.querySelector('.input-codigo');
  const inputDescripcion = div.querySelector('.input-descripcion');
  const btnQuitar = div.querySelector('.btn-quitar');

  inputCodigo.addEventListener('input', () => {
    const encontrado = codigosDisponibles.find(
      c => c.codigo.toLowerCase() === inputCodigo.value.trim().toLowerCase()
    );
    inputDescripcion.value = encontrado ? encontrado.descripcion : '';
  });

  btnQuitar.addEventListener('click', () => {
    if (contenedorProductos.children.length > 1) {
      div.remove();
    } else {
      mostrarMensaje('Debe quedar al menos un producto.', 'error');
    }
  });

  contenedorProductos.appendChild(div);
}

// 3. Armar y enviar la solicitud
async function enviarSolicitud(e) {
  e.preventDefault();
  const btnEnviar = document.getElementById('btnEnviar');
  btnEnviar.disabled = true;
  mostrarMensaje('Enviando solicitud...', '');

  const nombres = document.getElementById('nombres').value.trim();
  const correo = document.getElementById('correo').value.trim();
  const centroCostos = document.getElementById('centroCostos').value.trim();
  const bloquesProducto = document.querySelectorAll('.producto');

  try {
    const items = [];
    for (const bloque of bloquesProducto) {
      const codigo = bloque.querySelector('.input-codigo').value.trim();
      const descripcion = bloque.querySelector('.input-descripcion').value.trim();
      const cantidad = bloque.querySelector('.input-cantidad').value;
      const unidad = bloque.querySelector('.input-unidad').value;
      const referenciaTexto = bloque.querySelector('.input-ref-texto').value.trim();
      const comentarios = bloque.querySelector('.input-comentarios').value.trim();

      items.push({ codigo, descripcion, cantidad, unidad, referenciaTexto, comentarios });
    }

    const resp = await fetch(URL_APPS_SCRIPT, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ nombres, correo, centroCostos, items })
    });
    const data = await resp.json();

    if (data.status === 'ok') {
      mostrarMensaje('Solicitud enviada correctamente.', 'exito');
      document.getElementById('formSolicitud').reset();
      contenedorProductos.innerHTML = '';
      agregarProducto();
    } else {
      mostrarMensaje('Error: ' + data.mensaje, 'error');
    }
  } catch (err) {
    mostrarMensaje('No se pudo enviar la solicitud. Intenta de nuevo.', 'error');
  } finally {
    btnEnviar.disabled = false;
  }
}

function mostrarMensaje(texto, tipo) {
  mensaje.textContent = texto;
  mensaje.className = tipo;
}

document.getElementById('btnAgregar').addEventListener('click', agregarProducto);
document.getElementById('formSolicitud').addEventListener('submit', enviarSolicitud);

cargarCodigos();
agregarProducto();
</script>
</body>
</html>
